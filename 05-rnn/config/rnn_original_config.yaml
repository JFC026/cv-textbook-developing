# RNN Config File（完整版）
data:
  data_dir: "data"
  seq_length: 25          # 序列长度
  train_split: 0.85       # 85%训练
  val_split: 0.10         # 10%验证

model:
  hidden_size: 128        # 隐藏层大小
  learning_rate: 0.001    # Adam优化器需要较小的学习率
  clip_grad: 5.0          # 梯度裁剪

training:
  epochs: 50              # 训练轮数
  batch_size: 32          # 批次大小
  print_every: 5          # 每5个epoch打印
  sample_every: 10        # 每10个epoch生成样本
  sample_length: 300      # 生成样本长度
  random_seed: 42
  early_stopping: true    # 早停机制
  patience: 10            # 早停耐心值
  min_delta: 0.001        # 最小改进阈值
  lr_decay: 0.95          # 学习率衰减率
  lr_decay_every: 10      # 每10个epoch衰减

results:
  save_dir: "results"
  model_save_path: "results/rnn_model_original.pkl"  
  plots_dir: "results/plots"